#Info tooltips that appear when looking at a block. Only affects your own screen.
["Info Tooltips"]
	#Info tooltips only show while wearing the Straw Hat.
	needStrawHat = false
	#Shows an info tooltip when looking at the Grapevine Pot.
	showGrapevinePotInfo = true
	#Shows an info tooltip when looking at wine racks, the wine box and other wine storage.
	showStorageInfo = true

#Fine-tuning of the effects.
[Effects]

	[Effects."Completionist Banner Effect"]
		#The Completionist Banner gives its effect to players nearby.
		bannerGiveEffect = true
		#The Completionist Banner shows its effect in the item tooltip. Hidden while the banner effect is off.
		bannerShowTooltip = true
